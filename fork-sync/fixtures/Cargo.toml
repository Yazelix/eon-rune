[workspace]
resolver = "3"
members = ["eon-workspace-protocol", "orbit-protocol", "venus"]

[patch.crates-io]
wgpu-hal = { path = "@RUNE@/vendor/wgpu-hal" }
winit = { git = "https://github.com/Yazelix/winit-0.30.git", rev = "7c209ec5bebbd2963f75a39f79b320af6b03f72c" }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
[profile.release]
codegen-units = 16
incremental = true
[profile.perf]
inherits = "release"
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false
